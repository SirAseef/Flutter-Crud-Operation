  <rect x="96" y="92" width="136" height="136" rx="36" fill="url(#tile)" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5"/>
  <g transform="translate(124 120)" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
