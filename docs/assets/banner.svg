  <text x="272" y="148" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">Flutter CRUD Operation</text>
  <rect x="274" y="168" width="120" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="274" y="214" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="23" fill="#FFFFFF" fill-opacity="0.85">Real-time product inventory · Flutter + GetX + Firebase Firestore &amp; Storage</text>
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF">
    <rect x="274" y="240" width="96" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.12"/><text x="322" y="263" text-anchor="middle">Create</text>
    <rect x="380" y="240" width="96" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.12"/><text x="428" y="263" text-anchor="middle">Read</text>
    <rect x="486" y="240" width="96" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.12"/><text x="534" y="263" text-anchor="middle">Update</text>
    <rect x="592" y="240" width="96" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.12"/><text x="640" y="263" text-anchor="middle">Delete</text>
